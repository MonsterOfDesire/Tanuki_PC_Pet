<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2b2119" flood-opacity=".22"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#302923"/>
      <stop offset="1" stop-color="#211d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97b50"/>
      <stop offset="1" stop-color="#bf5e3d"/>
    </linearGradient>
    <style>
      .ui { font-family: "Microsoft JhengHei UI", "Noto Sans TC", sans-serif; }
      .title { fill: #fffaf2; font-weight: 800; font-size: 19px; }
      .label { fill: #fffaf2; font-weight: 700; font-size: 15px; }
      .muted { fill: #d5c8bb; font-size: 12px; }
      .section { fill: #cdbb9f; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
      .note-title { fill: #332b25; font-weight: 800; font-size: 20px; }
      .note { fill: #5b5148; font-size: 15px; }
      .icon { fill: none; stroke: #fffaf2; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-dark { fill: none; stroke: #6d5947; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f3eee7"/>
  <circle cx="1120" cy="76" r="120" fill="#eadfce"/>
  <circle cx="55" cy="660" r="150" fill="#e7ddcf"/>
  <text x="70" y="60" class="ui note-title" font-size="27">狸貓控制中心｜側邊啟動器設計</text>
  <text x="70" y="88" class="ui note">把操作入口與設定內容分離，展開與收合都維持人工設計外觀。</text>

  <!-- Expanded launcher -->
  <g filter="url(#shadow)">
    <rect x="82" y="120" width="310" height="520" rx="24" fill="url(#panel)" stroke="#e4b75f" stroke-width="2"/>
    <rect x="82" y="120" width="310" height="64" rx="24" fill="#393029"/>
    <rect x="82" y="162" width="310" height="22" fill="#393029"/>
    <line x1="102" y1="184" x2="372" y2="184" stroke="#79654c" stroke-width="1"/>

    <circle cx="118" cy="152" r="26" fill="#f3bd5c"/>
    <image href="../side.png" x="90" y="124" width="56" height="56" preserveAspectRatio="xMidYMid meet"/>
    <text x="158" y="158" class="ui title">狸貓控制中心</text>
    <path d="M346 143h10l-2 6 3 3h-5l-1 8-1-8h-5l3-3z" class="icon" opacity=".9"/>
    <path d="M371 146l-6 6 6 6" class="icon" opacity=".8"/>

    <text x="104" y="215" class="ui section">主要功能</text>

    <!-- Info center card -->
    <rect x="102" y="231" width="129" height="120" rx="16" fill="url(#accent)" stroke="#f2bf5d" stroke-width="2"/>
    <rect x="128" y="251" width="77" height="54" rx="8" fill="#fff7e9" opacity=".94"/>
    <rect x="137" y="260" width="59" height="7" rx="3" fill="#c76742"/>
    <rect x="137" y="274" width="24" height="20" rx="4" fill="#e4b75f"/>
    <rect x="166" y="274" width="30" height="5" rx="2" fill="#9b8c7c"/>
    <rect x="166" y="284" width="24" height="5" rx="2" fill="#c4b8aa"/>
    <text x="166" y="328" text-anchor="middle" class="ui label">資訊中心</text>

    <!-- Food tray card -->
    <rect x="243" y="231" width="129" height="120" rx="16" fill="#40372f" stroke="#806d57" stroke-width="1.5"/>
    <path d="M273 278h68l-7 25h-54z" class="icon"/>
    <path d="M282 278c4-17 15-25 25-25 11 0 21 8 25 25" class="icon"/>
    <path d="M292 268c8 5 19 5 29 0" class="icon"/>
    <text x="307" y="328" text-anchor="middle" class="ui label">飲食餐盤</text>

    <text x="104" y="384" class="ui section">目前狀態</text>
    <rect x="102" y="398" width="270" height="54" rx="13" fill="#171512" stroke="#5b4f42"/>
    <rect x="113" y="410" width="92" height="30" rx="15" fill="#5a4939"/>
    <circle cx="130" cy="425" r="5" fill="#f2bf5d"/>
    <text x="143" y="430" class="ui muted" fill="#fffaf2">黃金傳說</text>
    <rect x="212" y="410" width="55" height="30" rx="15" fill="#3c513a"/>
    <circle cx="228" cy="425" r="5" fill="#79c567"/>
    <text x="240" y="430" class="ui muted" fill="#fffaf2">1x</text>
    <rect x="274" y="410" width="87" height="30" rx="15" fill="#3c513a"/>
    <circle cx="290" cy="425" r="5" fill="#79c567"/>
    <text x="302" y="430" class="ui muted" fill="#fffaf2">照護中</text>

    <rect x="102" y="468" width="270" height="52" rx="13" fill="#332d28" stroke="#806d57"/>
    <circle cx="128" cy="494" r="8" class="icon"/>
    <path d="M128 481v4m0 18v4m-13-13h4m18 0h4" class="icon" stroke-width="1.7"/>
    <text x="153" y="500" class="ui label">狀態設定</text>

    <rect x="102" y="536" width="270" height="50" rx="13" fill="#2c2723" stroke="#5d5145"/>
    <path d="M128 552v11m-8-6a11 11 0 1 0 16 0" class="icon"/>
    <text x="153" y="567" class="ui label">關閉系統</text>

    <rect x="174" y="610" width="126" height="5" rx="2.5" fill="#705f4c"/>
  </g>

  <text x="237" y="675" text-anchor="middle" class="ui note" font-weight="700">展開：310 × 520 logical px</text>

  <!-- Collapsed launcher -->
  <g filter="url(#shadow)">
    <rect x="470" y="120" width="72" height="520" rx="24" fill="url(#panel)" stroke="#e4b75f" stroke-width="2"/>
    <circle cx="506" cy="154" r="26" fill="#f3bd5c"/>
    <image href="../side.png" x="479" y="127" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    <line x1="486" y1="190" x2="526" y2="190" stroke="#79654c"/>

    <rect x="482" y="202" width="48" height="48" rx="13" fill="#3b332c" stroke="#806d57"/>
    <path d="M498 220l9 6-9 6m9-6h9" class="icon"/>

    <rect x="482" y="262" width="48" height="48" rx="13" fill="url(#accent)" stroke="#f2bf5d" stroke-width="1.5"/>
    <rect x="492" y="274" width="28" height="21" rx="4" fill="#fff7e9"/>
    <line x1="497" y1="280" x2="515" y2="280" stroke="#c76742" stroke-width="2"/>
    <line x1="497" y1="287" x2="510" y2="287" stroke="#8c7969" stroke-width="2"/>

    <rect x="482" y="322" width="48" height="48" rx="13" fill="#3b332c" stroke="#6f5e4b"/>
    <path d="M491 342h30l-3 12h-24zM496 342c2-8 7-11 10-11 5 0 9 4 11 11" class="icon" stroke-width="1.8"/>

    <circle cx="506" cy="395" r="5" fill="#f2bf5d"/>
    <circle cx="506" cy="418" r="5" fill="#79c567"/>
    <circle cx="506" cy="441" r="5" fill="#79c567"/>

    <rect x="482" y="462" width="48" height="48" rx="13" fill="#3b332c" stroke="#6f5e4b"/>
    <circle cx="506" cy="486" r="8" class="icon"/>
    <path d="M506 473v4m0 18v4m-13-13h4m18 0h4" class="icon" stroke-width="1.7"/>

    <rect x="482" y="522" width="48" height="48" rx="13" fill="#2c2723" stroke="#5d5145"/>
    <path d="M506 536v10m-7-6a9 9 0 1 0 14 0" class="icon"/>
  </g>

  <text x="506" y="675" text-anchor="middle" class="ui note" font-weight="700">收合：72 px</text>

  <!-- Design rules -->
  <g class="ui">
    <rect x="618" y="128" width="510" height="470" rx="24" fill="#fffaf4" stroke="#d8c6ae" stroke-width="2"/>
    <text x="654" y="176" class="note-title">設計重點</text>

    <circle cx="668" cy="218" r="18" fill="#c76742"/>
    <text x="668" y="224" text-anchor="middle" fill="#fffaf2" font-size="15" font-weight="800">1</text>
    <text x="700" y="214" class="note-title" font-size="17">側欄只做啟動與概覽</text>
    <text x="700" y="239" class="note">世界模式、時間、冷卻等表單留在資訊中心。</text>

    <circle cx="668" cy="291" r="18" fill="#c76742"/>
    <text x="668" y="297" text-anchor="middle" fill="#fffaf2" font-size="15" font-weight="800">2</text>
    <text x="700" y="287" class="note-title" font-size="17">兩個主入口有明確視覺層級</text>
    <text x="700" y="312" class="note">資訊中心為主動作；飲食餐盤保持獨立工具窗。</text>

    <circle cx="668" cy="364" r="18" fill="#c76742"/>
    <text x="668" y="370" text-anchor="middle" fill="#fffaf2" font-size="15" font-weight="800">3</text>
    <text x="700" y="360" class="note-title" font-size="17">狀態膠囊只負責即時提示</text>
    <text x="700" y="385" class="note">獨立設定按鈕避免提示與操作功能重複。</text>

    <circle cx="668" cy="437" r="18" fill="#c76742"/>
    <text x="668" y="443" text-anchor="middle" fill="#fffaf2" font-size="15" font-weight="800">4</text>
    <text x="700" y="433" class="note-title" font-size="17">釘選收合後保留狀態提示</text>
    <text x="700" y="458" class="note">未釘選完全隱藏；釘選時三色點顯示目前狀態。</text>

    <circle cx="668" cy="510" r="18" fill="#c76742"/>
    <text x="668" y="516" text-anchor="middle" fill="#fffaf2" font-size="15" font-weight="800">5</text>
    <text x="700" y="506" class="note-title" font-size="17">隱藏、收合與關閉系統分開</text>
    <text x="700" y="531" class="note">降低誤觸離開；關閉系統保持文字與電源圖示。</text>

    <line x1="654" y1="558" x2="1092" y2="558" stroke="#ddcfbd"/>
    <text x="654" y="583" class="note" font-weight="700">實作目標：獨立 DashboardLauncherPanel，不再擴寫 dashboard_ui.py。</text>
  </g>
</svg>
