name: Windows CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run full test suite
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Validate all character manifests
        shell: pwsh
        run: python .\tools\manifest_xlsx_to_json.py --assets-dir .\assets_cropped

      - name: Validate portable build inputs
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          $outputRoot = Join-Path $env:RUNNER_TEMP "tanuki-build-check"
          .\build_lab_2.ps1 -PythonExe $pythonExe -OutputRoot $outputRoot -CheckOnly
